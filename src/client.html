<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обновление ПО — TRASSIR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*__BASECSS__*/
/*__UCSS__*/
</style>
</head>
<!-- Окно обновления ПО в клиенте TRASSIR, второй подход (встреча с продуктом, ноябрь 2026).
     Окно настроек — по макету Figma HBuvq4rJPBkOk1mnNANrCZ / 30181:111420 (заголовок с путём, дерево, вкладки, шрифт в натуральную величину).
     Обновление по сети: загрузка и установка идут в фоне — их видно в строке под кнопками и у «vms» в дереве; окон — минимум. -->
<body class="u-page gal-on">
<div class="desk"></div>

<!-- раскадровка: шаги сценария -->
<aside class="ugal" id="gal" aria-label="Раскадровка">
  <div class="ugal-h"><b>Раскадровка</b><span>Шаги сценария. Клик открывает окно в этом состоянии.</span></div>
  <div class="ugal-list" id="galList"></div>
  <div class="ugal-f"><a class="lnk" href="site.html" target="_blank">Страница загрузок на сайте ↗</a><button type="button" class="btn sm" id="galHide">Скрыть раскадровку</button></div>
</aside>
<button type="button" class="btn ugal-show" id="galShow" hidden>Раскадровка</button>

<div class="stage" id="stage">
  <div class="swin" id="pw">
    <div class="tbar nw-t"><div class="ttl"><img src="__ASSET:win-gear__" width="18" height="18" alt=""><span id="pTitle"></span></div>
      <div class="wctl"><button class="wbtn" type="button" aria-label="Развернуть" id="pMax"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="#333"/></svg></button><button class="wbtn close" type="button" aria-label="Закрыть"><img src="__ASSET:win-close__" width="12" height="12" alt=""></button></div>
    </div>
    <div class="nw-b">
      <div class="nw-side">
        <button type="button" class="nw-srv"><img src="__ASSET:srv-all__" width="22" height="19" alt=""><b>Все сервера</b><img class="chev" src="__ASSET:srv-chev__" width="7" height="4" alt=""></button>
        <nav class="nw-tree" id="tree" aria-label="Разделы"></nav>
        <input class="nw-find" type="search" placeholder="[быстрый поиск]" aria-label="Быстрый поиск">
      </div>
      <div class="nw-main">
        <div class="nw-tabs"><span class="ntab on">Настройка</span><span class="ntab">Справка</span><b class="nnews">Новости</b></div>
        <div class="nw-page" id="page"></div>
      </div>
    </div>
    <div class="nw-f"><button type="button" class="nbtn">Закрыть</button></div>
  </div>
  <div class="ubg" id="dlgBg"></div>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<!-- служебная панель прототипа -->
<div class="uscn" id="scn">
  <button type="button" class="uscn-t" id="scnTog" aria-expanded="false">Сценарии</button>
  <div class="uscn-b" id="scnBody" hidden>
    <label>Установка<select id="sOut"><option value="ok">Успешно</option><option value="fail">Ошибка — сервер вернёт прошлую версию</option></select></label>
    <label>Файлы на компьютере<select id="sFiles"><option value="found">Найдены</option><option value="none">Не найдены</option></select></label>
    <label>Пока загруженное ждёт установки<select id="sNewer"><option value="no">Новых версий нет</option><option value="yes">Вышла 4.9.16.0</option></select></label>
    <div class="uscn-g">Проблемные сценарии — позже</div>
    <label>Сеть<select id="sNet"><option value="avail">Доступно обновление</option><option value="latest">Уже последняя версия</option>
      <option value="offline">Нет доступа к сети</option><option value="nohost">Сервер обновлений недоступен</option>
      <option value="old">Версия слишком старая (4.6.9.0)</option><option value="space">Не хватает места на диске</option></select></label>
    <label>Загрузка<select id="sDl"><option value="ok">Проходит</option><option value="fail">Обрывается на 60%</option></select></label>
    <button type="button" class="btn sm" id="sDrop" disabled>Оборвать связь во время загрузки</button>
    <button type="button" class="btn sm" id="sWin">Вернуть окна на место</button>
    <button type="button" class="btn sm" id="sReset">Начать сначала</button>
    <p>Прототип. Номера сборок, время установки, пути к настройкам и записи журнала условные.</p>
  </div>
</div>

<script>
/*__ICONS__*/
/*__UJS__*/
</script>
</body>
</html>
