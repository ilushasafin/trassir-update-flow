<html lang="ru">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--txt:#1d2230;--muted:#6b6f76;--pri:#445b9c;--pri-dk:#364a82;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 Inter,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:56px 16px}
h1{font-size:26px;font-weight:600;margin:0 0 24px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btns a{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 28px;border-radius:var(--r);background:var(--pri);color:#fff;font-weight:600;text-decoration:none;transition:background .15s}
.btns a:hover{background:var(--pri-dk)}
@media (max-width:560px){ .btns a{flex:1 1 100%} }
</style>
</head>
